# The embedder's WebAssembly (../src/embed.wasm): the tokenizer and the
# encoder of a ModernBERT-style embedding model, built by ../build.sh.
# No dependencies, so the build reads nothing but this folder and the
# toolchain rust-toolchain.toml pins.
[package]
name = "grasp_embed"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
