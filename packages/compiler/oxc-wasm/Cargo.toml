# oxc's transform with its React Compiler, for the isolate that compiles
# App code, oxlint's linter and oxfmt's formatter, for the isolate that
# lints and formats it, and oxc's parser, for what reads App code's
# syntax (route-tree.ts, stand-ins.ts, classes.ts): one threadless
# wasm32-wasip1 module (src/oxc.ts).
# Built inside oxc's own workspace at the commit pin.json names (build.sh),
# so every dependency is the version that oxlint and oxfmt release ship.
#
# Delete this folder once oxc publishes threadless WebAssembly builds of
# its linter, formatter and React transform that start small.
[package]
name = "grasp_oxc_wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
oxc = { workspace = true, features = [
  "ast_visit",
  "codegen",
  "semantic",
  "serialize",
  "transformer",
] }
oxc_formatter = { workspace = true }
oxc_formatter_core = { workspace = true }
oxc_linter = { workspace = true }
oxc_react_compiler = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
