# Deploys the admin, router and connect gateway to Grasp's Cloudflare account, the one
# staging's core and connect run in too: the admin holds a token for every
# client, so it never changes on a merge. Run it by hand from main once
# the change works in staging. Require a reviewer on the grasp-os-ops
# environment in GitHub so a second person approves every run.
#
# Every run also copies the shared secrets (Grasp's OAuth app secrets and
# Composio key) from 1Password into the ops account's Secrets Store, where
# the admin reads them to set on each client's Workers. The admin never
# holds a 1Password credential. Run it with "secrets only" after rotating one
# in 1Password to copy it without deploying; a secrets-only rollout from the
# admin then takes it to every client.
name: Deploy grasp-os-ops

on:
  workflow_dispatch:
    inputs:
      secrets-only:
        description: Only copy the shared secrets to Secrets Store; deploy nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-grasp-os-ops
  cancel-in-progress: false

jobs:
  deploy-ops:
    name: deploy-ops
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: grasp-os-ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      # The Cloudflare credentials and store, from the ops 1Password
      # Environment, as everything this workflow reads:
      # OP_SERVICE_ACCOUNT_TOKEN, the environment's secret, is the only value
      # kept in GitHub.
      - uses: ./.github/actions/load-1password
        with:
          environment: ops
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          secrets: CLOUDFLARE_API_TOKEN
          settings: CLOUDFLARE_ACCOUNT_ID SECRETS_STORE_ID
          required: CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN SECRETS_STORE_ID
      # The shared secrets, loaded right before the step that copies them
      # and cleared from the job's env right after, so no deploy sees them.
      # Each is named as the Worker secret it becomes.
      - uses: ./.github/actions/load-1password
        with:
          environment: ops
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          secrets: ENTRA_CLIENT_SECRET MICROSOFT_CLIENT_SECRET GOOGLE_CLIENT_SECRET COMPOSIO_API_KEY
      # Secrets Store keeps each secret by an ID of its own: an existing one
      # is updated by that ID, a missing one created. Values go to wrangler
      # on stdin, never as an argument or in a log line, and are written
      # every run: Secrets Store never reads a value back to compare.
      # The API token reaches curl through its config on stdin, not argv.
      # The store holds only fixed secrets (these, the deployer token, the
      # router key and the client key), never one per client, so one page
      # normally covers it; the list is still read page by page up to
      # `total_pages`.
      - name: Copy the shared secrets to Secrets Store
        run: |
          set -euo pipefail
          names=(ENTRA_CLIENT_SECRET MICROSOFT_CLIENT_SECRET GOOGLE_CLIENT_SECRET COMPOSIO_API_KEY)
          # Every value is checked before any is written, so an empty field
          # never leaves the store half updated. Only names are reported.
          empty=()
          for name in "${names[@]}"; do
            if [ -z "${!name}" ]; then
              empty+=("$name")
            fi
          done
          if [ "${#empty[@]}" -gt 0 ]; then
            echo "::error::Empty in the ops 1Password Environment, nothing written: ${empty[*]}"
            exit 1
          fi
          existing='[]'
          page=1
          while :; do
            response=$(printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN" |
              curl --silent --show-error --fail-with-body --config - \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores/$SECRETS_STORE_ID/secrets?per_page=100&page=$page")
            existing=$(jq -c --argjson page "$(jq -c '[.result[] | {name, id}]' <<< "$response")" '. + $page' <<< "$existing")
            total=$(jq -r '.result_info.total_pages // 1' <<< "$response")
            if [ "$page" -ge "$total" ]; then
              break
            fi
            page=$((page + 1))
          done
          for name in "${names[@]}"; do
            id=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<< "$existing")
            if [ -z "$id" ]; then
              printf '%s' "${!name}" | vp exec wrangler secrets-store secret create "$SECRETS_STORE_ID" --name "$name" --scopes workers --remote
            else
              printf '%s' "${!name}" | vp exec wrangler secrets-store secret update "$SECRETS_STORE_ID" --secret-id "$id" --remote
            fi
          done
      - name: Clear the shared secrets from the job's env
        if: always()
        run: |
          for name in ENTRA_CLIENT_SECRET MICROSOFT_CLIENT_SECRET GOOGLE_CLIENT_SECRET COMPOSIO_API_KEY; do
            echo "$name=" >> "$GITHUB_ENV"
          done
      # A D1 database's jurisdiction is set only when it is created, and deploy
      # would auto-provision a missing one outside the EU: create the
      # admin's database before its first deploy, as CI does for
      # grasp-os-staging. One that exists outside the EU stops the deploy; it
      # has to be recreated.
      - name: Create the admin database in the EU
        if: ${{ !inputs.secrets-only }}
        run: |
          existing=$(vp exec wrangler d1 list --json)
          jurisdiction=$(jq -r '.[] | select(.name == "grasp-os-admin") | .jurisdiction // "none"' <<< "$existing")
          if [ -z "$jurisdiction" ]; then
            vp exec wrangler d1 create grasp-os-admin --jurisdiction eu
          elif [ "$jurisdiction" != "eu" ]; then
            echo "::error::D1 database grasp-os-admin is not in the EU jurisdiction ($jurisdiction)"
            exit 1
          fi
      # D1 migrations are additive, so the running admin keeps working on
      # the new schema until the deploy after them replaces it.
      - if: ${{ !inputs.secrets-only }}
        run: vp run --filter @grasp-os/admin db:migrate
      # Router first: the admin binds its hostname map, which the router's
      # first deploy creates, and both need the account's Secrets Store
      # (scripts/wrangler-deploy.ts fills in both ids). So a router deploy
      # that fails stops the admin's too. Besides Workers Scripts, D1 and
      # Secrets Store, the job's token needs Workers KV Storage (read, to
      # find the map) and Workflows (edit: the admin's deploy registers
      # its provisioning Workflow).
      - if: ${{ !inputs.secrets-only }}
        run: vp run --filter @grasp-os/router deploy
      # The connect gateway (apps/gateway, GRA-1217), next to the router:
      # every placed client's core reaches its own connect in the clients'
      # dispatch namespace through it. The admin only binds placed cores to
      # it, so deploying it changes nothing for anyone until it does.
      - if: ${{ !inputs.secrets-only }}
        run: vp run --filter @grasp-os/gateway deploy
      # The admin verifies every request's Access JWT against its Access
      # application (apps/admin/src/access.ts) and refuses everyone
      # without these, so a deploy without them would lock staff out: stop
      # before deploying. They're settings in the ops 1Password
      # Environment, not secrets: the AUD tag and the team URL
      # identify the app, they grant nothing. So is CLIENT_DOMAIN, the
      # domain clients are served under: without it the admin provisions
      # and deploys no client, but works otherwise, so it's passed only when
      # set (keep_vars keeps the last one). So are ENTRA_CLIENT_ID and GOOGLE_CLIENT_ID, Grasp's
      # OAuth apps' client ids, which each client's core signs people in
      # with: a client whose sign-in names an IdP without one isn't deployed.
      # So is GRASP_CLIENT_ID, Grasp's own client, whose core answers Ask
      # Grasp with its model gateway: without it the chat isn't set up.
      # So is ROOMS_ORIGIN, Grasp's Rooms' team origin, which the admin reads
      # each company's proposal from with ROOMS_READ_TOKEN (Secrets Store):
      # without it the proposal says Rooms isn't connected.
      # So is ADMIN_HOST, Grasp's admin's own hostname (admin.<domain>,
      # apps/admin/src/admin-host.ts): a route of the admin's Worker
      # and a hostname of its Access application, both set by hand.
      # So are DISCORD_PUBLIC_KEY and DISCORD_STAFF_IDS, Grasp's Discord
      # application's public key and the staff's Discord user ids
      # (apps/admin/src/admin/discord.ts): without them the bot answers
      # no one. Settings, not secrets, so not masked; one left out of the
      # Environment is empty.
      - if: ${{ !inputs.secrets-only }}
        uses: ./.github/actions/load-1password
        with:
          environment: ops
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          settings: CF_ACCESS_AUD CF_ACCESS_ISS CLIENT_DOMAIN ENTRA_CLIENT_ID GOOGLE_CLIENT_ID GRASP_CLIENT_ID ROOMS_ORIGIN ADMIN_HOST DISCORD_PUBLIC_KEY DISCORD_STAFF_IDS
      - name: Deploy the admin with its Access settings
        if: ${{ !inputs.secrets-only }}
        run: |
          set -euo pipefail
          if [ -z "$CF_ACCESS_AUD" ] || [ -z "$CF_ACCESS_ISS" ]; then
            echo "::error::Set CF_ACCESS_AUD and CF_ACCESS_ISS in the ops 1Password Environment; nothing deployed"
            exit 1
          fi
          vars=(--var "CF_ACCESS_AUD:$CF_ACCESS_AUD" --var "CF_ACCESS_ISS:$CF_ACCESS_ISS")
          for name in CLIENT_DOMAIN ENTRA_CLIENT_ID GOOGLE_CLIENT_ID GRASP_CLIENT_ID ROOMS_ORIGIN ADMIN_HOST DISCORD_PUBLIC_KEY DISCORD_STAFF_IDS; do
            if [ -n "${!name}" ]; then
              vars+=(--var "$name:${!name}")
            fi
          done
          vp run --filter @grasp-os/admin build
          cd apps/admin
          vp exec node ../../scripts/wrangler-deploy.ts "${vars[@]}"
