# Builds oxc.wasm, oxlint's linter and oxfmt's formatter for the isolate
# that lints and formats App code (packages/compiler/oxc-wasm), and
# publishes it as an asset of the pre-release pin.json names: by oxc's
# commit and the hash of the glue (glue.ts), so a change to either is a
# release of another name, and no release ever holds a build of other
# glue. Installs, CI and release builds download it by that name and check
# the SHA-256 pin.json pins (wasm.ts), and never build it.
#
# Who can publish: a push to main, or someone with write access running it
# by hand on a branch (`gh workflow run build-oxc-wasm.yml --ref <branch>`),
# as the pull request that changes the glue needs its release to test;
# never any other push. The build runs with a read-only token and no
# credentials on disk, as it runs the build scripts and proc-macros of
# oxc's whole dependency tree; only the publish job, which runs nothing of
# the repo's or oxc's, can write, and it publishes the build's artifact.
#
# A release, once there, is built again and compared, byte for byte: the
# build is reproducible (build.sh says what fixes it), so anyone can check
# a release against the commit that names it. A mismatch fails the run.
name: Build oxc WASM

on:
  push:
    branches: [main]
    paths:
      - packages/compiler/oxc-wasm/**
      - .github/workflows/build-oxc-wasm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-oxc-wasm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    # An exact image, so the host's tools stay put; the toolchain is oxc's
    # (rust-toolchain.toml at the pinned commit).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      release: ${{ steps.pin.outputs.release }}
      published: ${{ steps.published.outputs.sha256 != '' }}
      sha256: ${{ steps.built.outputs.sha256 }}
      oxc: ${{ steps.pin.outputs.oxc }}
      glue: ${{ steps.pin.outputs.glue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node.js alone, for glue.ts: nothing is installed.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: false
          run-install: false
      # The release pin.json names, once its glue is this tree's.
      - id: pin
        run: |
          set -euo pipefail
          release=$(node packages/compiler/oxc-wasm/glue.ts --release)
          {
            echo "release=$release"
            echo "oxc=$(jq -r .oxc packages/compiler/oxc-wasm/pin.json)"
            echo "glue=$(jq -r .glue packages/compiler/oxc-wasm/pin.json)"
          } >> "$GITHUB_OUTPUT"
      - id: published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.pin.outputs.release }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE" --jq '.assets[] | select(.name == "oxc.wasm") | .digest')
            echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          fi
      - run: packages/compiler/oxc-wasm/build.sh "$RUNNER_TEMP/oxc.wasm"
      - id: built
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/oxc.wasm" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.sha256 != ''
        env:
          RELEASE: ${{ steps.pin.outputs.release }}
          PUBLISHED: ${{ steps.published.outputs.sha256 }}
          BUILT: ${{ steps.built.outputs.sha256 }}
        run: |
          if [ "$BUILT" != "$PUBLISHED" ]; then
            echo "::error::$RELEASE's oxc.wasm has SHA-256 $PUBLISHED, but this build of the same commit and glue has $BUILT"
            exit 1
          fi
          echo "$RELEASE is published already, and this build of it is byte for byte the same: SHA-256 \`$BUILT\`." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.published.outputs.sha256 == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxc-wasm
          path: ${{ runner.temp }}/oxc.wasm
          if-no-files-found: error
          retention-days: 7

  # Runs nothing but GitHub's CLI on the build's artifact: no checkout.
  publish:
    name: publish
    needs: build
    if: needs.build.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oxc-wasm
          path: ${{ runner.temp }}/oxc-wasm
      # A pre-release, never "latest": it is a build input, not a release
      # of Grasp. Its notes say what it was built from.
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.build.outputs.release }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          OXC: ${{ needs.build.outputs.oxc }}
          GLUE: ${{ needs.build.outputs.glue }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          wasm="$RUNNER_TEMP/oxc-wasm/oxc.wasm"
          if [ "$(sha256sum "$wasm" | cut -d ' ' -f 1)" != "$SHA256" ]; then
            echo "::error::The artifact isn't what the build job built"
            exit 1
          fi
          gh release create "$RELEASE" "$wasm" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "$RELEASE" \
            --notes "oxlint and oxfmt as WebAssembly (packages/compiler/oxc-wasm), built by $RUN from $GITHUB_SHA.

          - oxc commit: $OXC (oxc's own Rust toolchain at it, rust-toolchain.toml; target wasm32-wasip1)
          - Glue (packages/compiler/oxc-wasm/glue.ts): $GLUE
          - SHA-256: $SHA256"
          echo "Published $RELEASE: oxc.wasm, SHA-256 \`$SHA256\` (pin it in packages/compiler/oxc-wasm/pin.json)." >> "$GITHUB_STEP_SUMMARY"
