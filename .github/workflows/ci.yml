# Trunk-based: feature branch -> pull request into main -> merge queue, which
# tests it on top of the latest main and squash-merges it. Checks run on pull
# requests and in the merge queue; a push to main only deploys what those
# checks already tested: it builds the release once, deploys those bytes
# to grasp-os-staging, and once staging accepts them publishes the same
# bytes as a release for the console. grasp-os-ops is deployed by hand
# with the Deploy grasp-os-ops workflow. Jobs with secrets never run for pull
# requests from forks. CI never deploys to a client account: the console
# rolls releases out.
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Everything but `vp test`, once: format, lint and types, the repo checks,
  # the build, and that generated files are committed. Part of the required
  # `check` (below).
  static:
    name: static
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # About 2 minutes with a warm cache (October 2026).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check:migrations compares with origin/main.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp check
      - run: vp run check:secrets
      - run: vp run check:docs
      - run: vp run check:product-name
      - run: vp run check:migrations
      - run: vp run check:wrangler-configs
      - run: vp run check:state-registry
      - run: vp run check:playwright-image
      - run: vp run -r build
      # The console isn't deployed from here (see deploy-staging): check that
      # its build is a Worker wrangler would deploy. No credentials needed.
      - run: vp exec wrangler deploy --dry-run
        working-directory: apps/console
      # Generated files (Worker types, route trees, migrations, the
      # frontend's translation catalogs) must be committed.
      - run: vp run -r typegen && vp run -r db:generate && vp run -r i18n:extract
      - run: git diff --exit-code && test -z "$(git status --porcelain)"

  # `vp test` in shards, a runner each: unsharded, one passing run reached
  # 16 minutes at about 5,300 tests (October 2026). Each shard gets its part
  # of the test files, split by how long each takes
  # (scripts/test-sequencer.ts, with the times in
  # scripts/test-durations.json), so the shards end together and together
  # run every file once. Add a shard by adding to `shard`: `--shard` takes
  # the count from the matrix. Part of the required `check` (below).
  test:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # The test step's 25 minutes, and room for the steps around it.
    timeout-minutes: 31
    strategy:
      # A failing shard doesn't cancel the other: each says what failed in
      # it.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      # gdb, for the stall reporter to print the thread stacks of each
      # workerd before it ends a stalled run (GRASP_STALL_DUMP_STACKS below,
      # scripts/stack-dump.ts). Ubuntu lets a process trace only its own
      # descendants, and workerd is gdb's sibling, so tracing is opened up:
      # the runner is a throwaway VM. A failed install leaves the dump to say
      # gdb didn't run, and the tests run regardless.
      - name: Install gdb for stall stack dumps
        continue-on-error: true
        timeout-minutes: 3
        run: |
          command -v gdb || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gdb)
          sudo sysctl -w kernel.yama.ptrace_scope=0
      # Two shards split by a hash of each file's path took 10 to 14
      # minutes each (October 2026), and a slow runner ran one into this
      # step's timeout: core's heaviest files could land together, and a
      # shard runs its project groups (core and the rest, then core's
      # screens, then on-prem) one after another. Five shards split by
      # duration took 4 to 7 minutes each at first, leaving room for a
      # runner twice as slow; four left the heaviest at about 9. As tests
      # grew, five reached the 16 minutes this step had, and 4 of 9 PR runs
      # lost a shard to it (October 2026, GRA-981): six shards, durations
      # refreshed from recent runs, and 25 minutes, so a slow runner still
      # fits. Refresh the durations from the shards' test-progress
      # artifacts when the split drifts (scripts/test-durations.ts).
      # Vitest's default runs a worker per CPU but one, which left a third
      # of the runner's CPU idle; a worker per CPU measured about 6% faster.
      # Vitest times a test out from inside its worker, so a worker that is
      # blocked, or whose request workerd cancelled, never reports its test.
      # The stall reporter (scripts/stall-reporter.ts) names such a test or
      # file and ends the run once it is well past its timeout. A hang
      # outside any test (teardown, shutting the pool down) fails at this
      # step's timeout, instead of at the job's limit. Two minutes before
      # that, the reporter prints the files and tests still running, and
      # each finished test is in the shard's test-progress artifact. "0
      # files, 0 tests" there means the hang is in teardown or in shutting
      # the pool down. A run that doesn't pass says why in the shard's step
      # summary and as an annotation: the reporter's verdict, or Vitest's
      # failed files and unhandled errors (a worker that exits shows as
      # one), with the runner's memory.
      # Reporters given here replace Vitest's defaults, so github-actions is
      # listed for the inline failure annotations.
      - run: vp test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=100% --reporter=default --reporter=github-actions --reporter=./scripts/stall-reporter.ts
        timeout-minutes: 25
        env:
          # Below the step's timeout, so the reporter says what still runs
          # before the step is killed.
          GRASP_STALL_REPORT_AFTER_MINUTES: 23
          # Seconds past a test's own timeout (counted for each attempt):
          # room for the hooks around it, which have timeouts of their own.
          # The longest is 120 s, set by workerflow's process tests
          # (packages/workerflow/vite.process.config.ts); the rest use
          # Vitest's 10 s. 300 s covers that 120 s before and after a test,
          # with headroom for a loaded runner. Only lower it below twice the
          # longest hook timeout if that drops.
          GRASP_TEST_OVERDUE_GRACE_SECONDS: 300
          GRASP_TEST_PROGRESS_FILE: ${{ runner.temp }}/test-progress.log
          # Before ending a stalled run, print each workerd's thread stacks
          # (a busy main thread sampled again, with V8's JavaScript stack),
          # their sockets and peers by ss, and the Vitest process's own
          # stack and sockets: at most 20 s and 300 KB, so the log shows
          # where it is stuck.
          GRASP_STALL_DUMP_STACKS: gdb
      # Kept for passing runs too: the durations the shards are split by
      # come from it (scripts/test-durations.ts).
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One per shard: a run's artifact names are unique.
          name: test-progress-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: ${{ runner.temp }}/test-progress.log
          if-no-files-found: ignore
          retention-days: 14
      # What the runner looked like when the job failed: its memory, the
      # processes holding the most (workerd left running shows here), and
      # any process the kernel killed for memory, which ends a step with
      # nothing of its own to say.
      - if: failure()
        run: |
          free -m
          ps -eo pid,ppid,rss,etime,args --sort=-rss | head -n 15 | cut -c 1-200
          if kernel_log=$(sudo dmesg --ctime 2>&1); then
            grep -iE 'out of memory|oom-kill|killed process' <<< "$kernel_log" || echo "The kernel killed no process for memory."
          else
            echo "The kernel log is unavailable, so an OOM kill can't be ruled out: $kernel_log"
          fi

  # The one required check (.github/rulesets/main.json) for static and every
  # test shard, so sharding leaves the ruleset as it is. It runs however
  # they ended, and passes only if all of them passed: GitHub counts a
  # skipped required check as passing, so this job mustn't be skipped when
  # one of them failed, was cancelled or was skipped.
  check:
    name: check
    needs: [static, test]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "static: $STATIC, test shards: $TEST"
          if [ "$STATIC" != success ] || [ "$TEST" != success ]; then
            echo "::error title=check::static ended as $STATIC and the test shards as $TEST; check passes only when both succeed."
            exit 1
          fi
        env:
          STATIC: ${{ needs.static.result }}
          # A matrix job's result: a failure if any shard failed.
          TEST: ${{ needs.test.result }}

  # In Playwright's image, which has the browsers and their system packages
  # installed: `playwright install --with-deps` fetched 119 MB of them from
  # the Ubuntu mirror, up to 12 minutes when it was slow (October 2026,
  # GRA-1016). Its tag must be the catalog's @playwright/test, whose browser
  # builds it carries: check:playwright-image (static) holds the two
  # together, and Renovate moves them in one pull request.
  e2e:
    name: e2e
    if: github.event_name != 'push'
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The runner's own user, which owns the checkout, the caches and
      # $HOME, as Playwright's CI guide has it: Firefox won't start as root
      # in a home it doesn't own. A host IPC namespace, so Chromium's shared
      # memory isn't held to Docker's 64 MB /dev/shm.
      options: --user 1001 --ipc=host
    runs-on: ubuntu-latest
    # 11 to 20 minutes when it passed (October 2026), before the image: about
    # 1 minute of setup, the browsers' system packages from the Ubuntu mirror
    # (under a minute, but up to 12 when the mirror was slow), 2 minutes for
    # the stack to build and start, and 8 to 14 minutes of tests.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run e2e
      # A failing test is retried with a trace (playwright.config.ts): keep it.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # On-prem ready: core must boot on plain workerd.
  workerd:
    name: workerd
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run --filter @grasp-os/web build
      - run: vp run smoke:workerd
      # Code Mode's executor, with a Worker Loader, on plain workerd.
      - run: vp run smoke:code-mode

  # Builds a release bundle as main will publish it (core, connect, the
  # frontend's static files and D1 migrations, with its manifest) and checks
  # every blob against the manifest. For a pull request or the merge queue,
  # that's all. On a push to main it's the commit's only build: the bundle
  # is the run's `release` artifact, which deploy-staging deploys and
  # publish-release publishes as it is, so the release the console rolls
  # out is the one staging ran and accepted, byte for byte.
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run release:build --out release-out
      # Every file but the build's `.grasp-release` marker, which only
      # release:build reads. The download checks the artifact's digest, and
      # each job that uses it checks every file against the manifest again.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release-out/
          if-no-files-found: error
          retention-days: 14

  # The branch name and the PR title, which becomes the commit on main and the
  # release note. Skipped (which counts as passing) in the merge queue.
  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run check:branch
      - run: printf '%s\n' "$PR_TITLE" | vp exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # Deploys core and connect from the release job's bundle, never from
  # source: each Worker's modules, static files, bindings, compatibility
  # date and flags and D1 migrations are the manifest's, every file checked
  # against it first (scripts/release/deploy-release.ts). Then staging
  # accepts the release, or refuses it: core must answer its health check
  # as the version just deployed (scripts/release/accept-release.ts).
  # Secrets come from 1Password: one service account per environment, each
  # limited to its own vault, its token stored as a GitHub environment secret.
  deploy-staging:
    name: deploy-staging
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: grasp-os-staging
    concurrency:
      group: deploy-grasp-os-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://grasp-os-staging/cloudflare/account-id
          CLOUDFLARE_API_TOKEN: op://grasp-os-staging/cloudflare/api-token
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release-out
      # A D1 database's jurisdiction is set only when it is created, and deploy
      # would auto-provision a missing one outside the EU: create every
      # database a deployed app binds (see each wrangler.jsonc) before the
      # first deploy. One that exists outside the EU stops the deploy; it has
      # to be recreated.
      - name: Create the D1 databases in the EU
        run: |
          existing=$(vp exec wrangler d1 list --json)
          for db in grasp-os-core grasp-os-knowledge grasp-os-connect; do
            jurisdiction=$(jq -r --arg db "$db" '.[] | select(.name == $db) | .jurisdiction // "none"' <<< "$existing")
            if [ -z "$jurisdiction" ]; then
              vp exec wrangler d1 create "$db" --jurisdiction eu
            elif [ "$jurisdiction" != "eu" ]; then
              echo "::error::D1 database $db is not in the EU jurisdiction ($jurisdiction)"
              exit 1
            fi
          done
      # A bucket's jurisdiction, too, is set only when it is created: create
      # the audit archive (core's AUDIT_ARCHIVE) in the EU before the first
      # deploy.
      - name: Create the audit archive bucket in the EU
        run: vp exec wrangler r2 bucket info grasp-os-audit-archive --jurisdiction eu || vp exec wrangler r2 bucket create grasp-os-audit-archive --jurisdiction eu
      # And the bucket of Knowledge's version texts (core's BRAIN_OBJECTS).
      - name: Create the Brain objects bucket in the EU
        run: vp exec wrangler r2 bucket info grasp-os-brain-objects --jurisdiction eu || vp exec wrangler r2 bucket create grasp-os-brain-objects --jurisdiction eu
      # Each applies its Worker's D1 migrations from the release, then
      # deploys it. Migrations are additive, so the running code keeps
      # working on the new schema until the deploy after them replaces it.
      # connect first: core's service binding points at it.
      - run: vp run release:deploy --release release-out --worker connect
      - id: core
        run: vp run release:deploy --release release-out --worker core --var RUNTIME_PROFILE:cloudflare
      # Core's router secret, loaded only for the acceptance check, as
      # publish-release loads its R2 key.
      - id: router
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ROUTER_SECRET: op://grasp-os-staging/core/ROUTER_SECRET
      - run: vp run release:accept --release release-out --version "$CORE_VERSION"
        env:
          CORE_VERSION: ${{ steps.core.outputs.version }}
          ROUTER_SECRET: ${{ steps.router.outputs.ROUTER_SECRET }}
      # The console is deliberately not deployed to staging: it has no route
      # there and refuses every request without an Access application
      # (apps/console/src/access.ts). It deploys only to grasp-os-ops, with
      # deploy-ops. A real staging console would need a route and its own
      # Access application first. The static job still proves it builds.

  # The router on its own: its deploy needs the account's Secrets Store
  # (scripts/wrangler-deploy.ts), and an account not set up for it yet
  # mustn't hold back core and connect, nor publishing, which waits only
  # for deploy-staging. It isn't part of a release.
  deploy-staging-router:
    name: deploy-staging-router
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: grasp-os-staging
    concurrency:
      group: deploy-grasp-os-staging-router
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://grasp-os-staging/cloudflare/account-id
          CLOUDFLARE_API_TOKEN: op://grasp-os-staging/cloudflare/api-token
      - run: vp run --filter @grasp-os/router deploy

  # Every merge to main is a release: built once (the release job), verified
  # against its manifest and published to R2 in grasp-os-ops, where the
  # console imports it. It publishes the bundle staging ran, never a build
  # of its own. Deploys nothing itself, and runs only once deploy-staging
  # has deployed that bundle and staging accepted it: a release whose
  # staging migrations, deploys or acceptance fail is never published, so
  # the console can't roll it out to a client. When deploy-staging fails,
  # is cancelled or is skipped, this job is skipped too, and the commit's
  # changes ship in the next release that passes staging. The R2 key is
  # loaded after the download and passed only to the upload step; all
  # steps share one runner, so that isn't a security boundary. Skipped until
  # the repository variable PUBLISH_RELEASES is `true`, set once the bucket,
  # key and environment exist, and staging deploys. Pushes to main share the
  # workflow's concurrency group, which keeps only the newest pending run: in
  # a burst of merges a middle commit may never be published, and its
  # changes ship in the next release.
  publish-release:
    name: publish-release
    needs: [release, deploy-staging]
    if: github.event_name == 'push' && vars.PUBLISH_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: grasp-os-releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release-out
      - id: r2
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          R2_ENDPOINT: op://grasp-os-releases/r2/endpoint
          R2_ACCESS_KEY_ID: op://grasp-os-releases/r2/access-key-id
          R2_SECRET_ACCESS_KEY: op://grasp-os-releases/r2/secret-access-key
      - run: vp run release:upload --release release-out
        env:
          R2_ENDPOINT: ${{ steps.r2.outputs.R2_ENDPOINT }}
          R2_BUCKET: grasp-os-releases
          R2_ACCESS_KEY_ID: ${{ steps.r2.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.r2.outputs.R2_SECRET_ACCESS_KEY }}
