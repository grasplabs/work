# Trunk-based: feature branch -> pull request into main -> merge queue, which
# tests it on top of the latest main and squash-merges it. Checks run on pull
# requests and in the merge queue; a push to main only deploys what those
# checks already tested: it builds the release once and publishes those
# bytes for the staging admin, which rolls them out to staging's clients.
# A release staging accepted reaches production's admin only through the
# Promote release workflow. Both stages share Grasp's one Cloudflare
# account. A push to main also deploys staging's admin, router and connect
# gateway (deploy-platform, below); production's are deployed only by hand
# with the Deploy platform workflow. Jobs with secrets never run for pull
# requests from forks. CI deploys no client: the admins roll releases out.
#
# A draft pull request runs only the fast checks (static):
# the tests, workerd, the release build and the journeys wait until it is
# ready for review, which runs them all (`ready_for_review`). A draft can't
# be merged, and the merge queue runs the rest again on top of main.
# A ready pull request runs only the test projects its changes can affect
# (plan, below); the merge queue runs every one, but not the journeys
# (e2e, below). A nightly run on main runs everything: merges an admin
# makes skip the queue, and with them the full suite, so a gap in what the
# plan selects would otherwise show only once someone touches the package
# it missed. A run by hand from the Actions tab is the same full run. When
# the nightly run fails, it opens an issue (nightly-alert, below).
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  schedule:
    # Every night, 02:17 UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The nightly and by-hand runs on main in a group of their own: in main's,
# a push would wait for the full suite to end before it could publish.
# Pushes publish in a group named for that.
concurrency:
  group: ci-${{ contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) && 'full-' || github.event_name == 'push' && 'publish-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Everything but `vp test` and the build (release, below), once: format,
  # lint and types, the repo checks, that generated files are committed,
  # and on a pull request its branch name and title, which becomes the
  # commit on main and the release note. Part of the required `check`
  # (below).
  static:
    name: static
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check:migrations compares with origin/main. Without blobs: git
          # fetches the few it reads when it reads them, and the full
          # history's took most of this job's 9 s checkout.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - run: vp check
      - run: vp run check:secrets
      - run: vp run check:docs
      - run: vp run check:product-name
      - run: vp run check:migrations
      - run: vp run check:wrangler-configs
      - run: vp run check:vite-plus-oxc
      # Generated files (Worker types, migrations, the
      # frontend's translation catalogs) must be committed.
      - run: vp run -r typegen && vp run -r db:generate && vp run -r i18n:extract
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
      # The merge queue has no branch or title of its own: the pull
      # request's were checked before it joined.
      - if: github.event_name == 'pull_request'
        run: vp run check:branch
      - if: github.event_name == 'pull_request'
        run: printf '%s\n' "$PR_TITLE" | vp exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      # The squash commit on main is the title, the description and a
      # Co-authored-by trailer for each co-author of the PR's commits: none
      # may credit an AI tool (scripts/check-attribution.ts).
      - if: github.event_name == 'pull_request'
        run: |
          { printf '%s\n' "$PR_TITLE" "$PR_BODY"; git log --format=%B "$BASE..$HEAD"; } |
            node scripts/check-attribution.ts
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # Which test projects the run's changes can affect, and how many shards
  # their files take (scripts/test-plan.ts). A pull request compares its
  # merge commit with the main it was made on (HEAD^1): a change in a
  # workspace package runs the projects of that package and of every
  # package that depends on it, by pnpm's graph, and a change outside every
  # package (config, lockfile, CI, tooling) runs them all. The merge queue
  # runs them all. Shards: the fewest that each end within about 10 minutes
  # by the durations (scripts/test-shards.ts), at most 16. Not for drafts.
  # Small on purpose: the checkout's last two commits, the cached install,
  # and a few seconds of Vitest resolving its projects (no tests run).
  plan:
    name: plan
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
      shards: ${{ steps.plan.outputs.shards }}
      e2e: ${{ steps.plan.outputs.e2e }}
      admin-e2e: ${{ steps.plan.outputs['admin-e2e'] }}
      oxc-wasm: ${{ steps.oxc-wasm.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base it compares with.
          fetch-depth: 2
      # Saves node_modules when its cache missed, for the test shards after.
      - uses: ./.github/actions/setup
        with:
          save: true
      - id: plan
        run: node scripts/test-plan.ts
        env:
          GRASP_TEST_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      # Whether oxc.wasm's glue, its build, its pin or the committed
      # oxc-parse.wasm changed against the base, as the merge commit's first
      # parent: then the oxc-wasm job proves the pin and the committed module
      # (below). A full run (by hand, nightly) proves them too.
      - id: oxc-wasm
        run: |
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet HEAD^1 HEAD -- packages/compiler/oxc-wasm packages/sdk/src/oxc-parse.wasm .github/actions/oxc-wasm-build .github/workflows/build-oxc-wasm.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}

  # `vp test` in shards, a runner each: unsharded, one passing run reached
  # 16 minutes at about 5,300 tests (October 2026). Each shard gets its part
  # of the planned projects' test files, split by how long each takes
  # (scripts/test-sequencer.ts, with the times in
  # scripts/test-durations.json), so the shards end together and together
  # run every file once. The plan (above) sets how many: `--shard` takes
  # the count from the matrix. Skipped when the plan has no tests to run.
  # Part of the required `check` (below).
  test:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # The test step's 15 minutes, and room for the steps around it.
    timeout-minutes: 21
    strategy:
      # A failing shard doesn't cancel the other: each says what failed in
      # it.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # gdb, for the stall reporter to print the thread stacks of each
      # workerd before it ends a stalled run (GRASP_STALL_DUMP_STACKS below,
      # scripts/stack-dump.ts). Ubuntu lets a process trace only its own
      # descendants, and workerd is gdb's sibling, so tracing is opened up:
      # the runner is a throwaway VM. A failed install leaves the dump to say
      # gdb didn't run, and the tests run regardless.
      # In the background, beside the tests: the dump needs it only once a
      # run has stalled, minutes in, and the install took 10 to 15 s.
      - name: Install gdb for stall stack dumps
        continue-on-error: true
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0
          command -v gdb || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gdb > "$RUNNER_TEMP/gdb-install.log" 2>&1 &)
      # Shards split by how long each file takes (scripts/test-sequencer.ts,
      # with the times in scripts/test-durations.json), each shard running
      # one project group only (scripts/test-shards.ts): a shard that ran
      # its groups one after another started each group's pools after the
      # one before had ended, up to two minutes a group. Six shards took
      # 14 to 16 minutes (October 2026, GRA-1094). No shard's time can be
      # shorter than its longest file's, so split a file that sets it
      # rather than adding shards. Refresh the durations from the shards'
      # test-progress artifacts when the split drifts
      # (scripts/test-durations.ts).
      # A failed test is tried once more: a third of pull request runs
      # failed, most often on a few flaky files, each a whole re-run of CI
      # (October 2026). The flaky
      # reporter (scripts/flaky-reporter.ts) names every test that passed
      # only when tried again, as a warning and in the step summary, so it
      # is fixed, not retried for ever.
      # Vitest's default runs a worker per CPU but one, which left a third
      # of the runner's CPU idle; a worker per CPU measured about 6% faster.
      # Even then the CPUs were idle a third of the time, tests waiting on
      # their runs' timers (October 2026, GRA-1094): six workers on the
      # runner's four CPUs. Eight left as much idle and ran slower.
      # Vitest times a test out from inside its worker, so a worker that is
      # blocked, or whose request workerd cancelled, never reports its test.
      # The stall reporter (scripts/stall-reporter.ts) names such a test or
      # file and ends the run once it is well past its timeout, or once three
      # tests in a row timed out, a runtime wedged though each test still
      # times out in time (scripts/stall-reporter.ts). So does a
      # hang outside any test, after the files ended (a worker's teardown
      # after its file): once no file has run for the same grace, the run
      # ends with the workerd stacks, before this step's timeout when the
      # last file ended by about minute 9. Two minutes before
      # that timeout, the reporter prints the files and tests still running, and
      # each finished test is in the shard's test-progress artifact. "0
      # files, 0 tests" there means the hang is outside any test, after the
      # files ended. A run that doesn't pass says why in the shard's step
      # summary and as an annotation: the reporter's verdict, or Vitest's
      # failed files and unhandled errors (a worker that exits shows as
      # one), with the runner's memory.
      # Reporters given here replace Vitest's defaults, so github-actions is
      # listed for the inline failure annotations.
      # Beside the tests, the runner's memory once a minute
      # (scripts/memory-log.ts): a runner that runs out of memory dies with
      # only "shutdown signal" to say, and this step's log is all it keeps.
      # The plan's `--project` arguments, unquoted, none for every project.
      - run: |
          node scripts/memory-log.ts &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          vp test $GRASP_TEST_PROJECTS --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=150% --retry=1 --reporter=default --reporter=github-actions --reporter=./scripts/stall-reporter.ts --reporter=./scripts/flaky-reporter.ts
        timeout-minutes: 15
        env:
          GRASP_TEST_PROJECTS: ${{ needs.plan.outputs.projects }}
          # Below the step's timeout, so the reporter says what still runs
          # before the step is killed.
          GRASP_STALL_REPORT_AFTER_MINUTES: 13
          # Seconds past a test's own timeout (counted for each attempt):
          # room for the hooks around it, which have timeouts of their own.
          # The longest is 120 s, set by workerflow's process tests
          # (packages/workerflow/vite.process.config.ts); the rest use
          # Vitest's 10 s. 300 s covers that 120 s before and after a test,
          # with headroom for a loaded runner. Only lower it below twice the
          # longest hook timeout if that drops.
          GRASP_TEST_OVERDUE_GRACE_SECONDS: 300
          GRASP_TEST_PROGRESS_FILE: ${{ runner.temp }}/test-progress.log
          # Before ending a stalled run, print each workerd's thread stacks
          # (a busy main thread sampled again, with V8's JavaScript stack),
          # their sockets and peers by ss, and the Vitest process's own
          # stack and sockets: at most 20 s and 300 KB, so the log shows
          # where it is stuck.
          GRASP_STALL_DUMP_STACKS: gdb
      # Kept for passing runs too: the durations the shards are split by
      # come from it (scripts/test-durations.ts).
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One per shard: a run's artifact names are unique.
          name: test-progress-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: ${{ runner.temp }}/test-progress.log
          if-no-files-found: ignore
          retention-days: 14
      # What the runner looked like when the job failed: its memory, the
      # processes holding the most (workerd left running shows here), and
      # any process the kernel killed for memory, which ends a step with
      # nothing of its own to say.
      - if: failure()
        run: |
          free -m
          ps -eo pid,ppid,rss,etime,args --sort=-rss | head -n 15 | cut -c 1-200
          if kernel_log=$(sudo dmesg --ctime 2>&1); then
            grep -iE 'out of memory|oom-kill|killed process' <<< "$kernel_log" || echo "The kernel killed no process for memory."
          else
            echo "The kernel log is unavailable, so an OOM kill can't be ruled out: $kernel_log"
          fi

  # The one required check (.github/rulesets/main.json), for every job of
  # the run: a job added, split or removed leaves the ruleset as it is, and
  # no runner starts only to report a name the ruleset asks for. It runs
  # however they ended, and passes only if all of them passed: GitHub
  # counts a skipped required check as passing, so this job mustn't be
  # skipped when one of them failed, was cancelled or was skipped. Two
  # skips pass: the test shards when the plan has none to run, and, on a
  # draft, everything but static (a draft can't be merged; marking it
  # ready runs it all, and this check again). In the merge queue the
  # journeys (e2e, admin-e2e) skip too, and pass (why: e2e, below), and so
  # does a journey suite whose stack the plan finds unchanged.
  # Proves the pin of oxc.wasm before it merges, when the plan finds its
  # glue, its build or pin.json changed: builds it read-only from this
  # checkout, publishes nothing, and fails unless the release pin.json
  # names exists and its digest, the pin and this build are one
  # (.github/actions/oxc-wasm-build). Whoever published the release, the
  # bytes CI and every deployment run are then the glue's. About five
  # minutes of Rust, on a rare pull request. Part of the required `check`.
  oxc-wasm:
    name: oxc-wasm
    needs: plan
    if: needs.plan.outputs.oxc-wasm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/oxc-wasm-build
        with:
          check: true

  check:
    name: check
    needs:
      [
        static,
        plan,
        test,
        release,
        workerd,
        e2e-build,
        e2e,
        e2e-browsers,
        admin-e2e,
        oxc-wasm,
      ]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "static: $STATIC, plan: $PLAN ($SHARDS), test shards: $TEST, release: $RELEASE, workerd: $WORKERD, e2e parts: $E2E, admin-e2e: $ADMIN_E2E, oxc-wasm: $OXC_WASM, draft: $DRAFT, event: $EVENT"
          if [ "$STATIC" != success ]; then
            echo "::error title=check::static ended as $STATIC; check passes only when it succeeds."
            exit 1
          fi
          if [ "$DRAFT" = true ]; then
            echo "A draft runs only the fast checks; marking it ready for review runs the rest."
            exit 0
          fi
          if [ "$TEST" = skipped ] && [ "$PLAN" = success ] && [ "$SHARDS" = '[]' ]; then
            TEST="success (no tests affected)"
          fi
          # e2e's parts, its Firefox and WebKit part and the build they
          # start: one result, the first that isn't a success.
          for part in "$E2E_BUILD" "$E2E_BROWSERS"; do
            if [ "$E2E" = success ] && [ "$part" != success ]; then
              E2E=$part
            fi
          done
          if [ "$EVENT" = merge_group ] && [ "$E2E" = skipped ] && [ "$ADMIN_E2E" = skipped ]; then
            echo "The merge queue skips the journeys: the pull request's head passed them."
            E2E=success
            ADMIN_E2E=success
          fi
          if [ "$E2E" = skipped ] && [ "$PLAN" = success ] && [ "$E2E_RUNS" = false ]; then
            echo "The change doesn't reach e2e's stack: no journey to run."
            E2E="success (stack unchanged)"
          fi
          if [ "$ADMIN_E2E" = skipped ] && [ "$PLAN" = success ] && [ "$ADMIN_E2E_RUNS" = false ]; then
            echo "The change doesn't reach the admin's stack: no admin journey to run."
            ADMIN_E2E="success (stack unchanged)"
          fi
          if [ "$OXC_WASM" = skipped ] && [ "$PLAN" = success ] && [ "$OXC_WASM_RUNS" != true ]; then
            OXC_WASM="success (glue unchanged)"
          fi
          failed=""
          for job in "plan=$PLAN" "test shards=${TEST%% *}" "release=$RELEASE" "workerd=$WORKERD" "e2e parts=${E2E%% *}" "admin-e2e=${ADMIN_E2E%% *}" "oxc-wasm=${OXC_WASM%% *}"; do
            [ "${job#*=}" = success ] || failed="$failed ${job%%=*} (${job#*=}),"
          done
          if [ -n "$failed" ]; then
            echo "::error title=check::not every job succeeded:${failed%,}. check passes only when all of them do."
            exit 1
          fi
        env:
          STATIC: ${{ needs.static.result }}
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          RELEASE: ${{ needs.release.result }}
          WORKERD: ${{ needs.workerd.result }}
          # A matrix job's result: a failure if any shard or part failed.
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_BUILD: ${{ needs.e2e-build.result }}
          E2E_BROWSERS: ${{ needs.e2e-browsers.result }}
          ADMIN_E2E: ${{ needs.admin-e2e.result }}
          E2E_RUNS: ${{ needs.plan.outputs.e2e }}
          ADMIN_E2E_RUNS: ${{ needs.plan.outputs['admin-e2e'] }}
          OXC_WASM: ${{ needs.oxc-wasm.result }}
          OXC_WASM_RUNS: ${{ needs.plan.outputs.oxc-wasm }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          EVENT: ${{ github.event_name }}

  # The e2e stack, built once for every e2e part (`vp run e2e:build`,
  # e2e/build.ts): the frontend in development mode with the App compiler,
  # the extractor and the docs beside it, core's generated modules,
  # connect's build, and the stack's empty state with every migration
  # applied. Each part built it for itself, about 80 s of its 3 to 6
  # minutes (November 2026); now it only starts it (GRASP_E2E_PREBUILT,
  # playwright.config.ts). Beside the plan, not after it. Chromium's
  # headless shell is cached here too, by Playwright's version, for the
  # parts to restore.
  e2e-build:
    name: e2e-build
    if: github.event_name != 'push' && github.event_name != 'merge_group' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright-chromium
        with:
          save: true
      # About 70 s, the most of this job's 2 minutes: the parts wait for it.
      - run: vp run e2e:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-stack
          path: |
            apps/web/dist
            apps/core/dist
            apps/connect/dist
            packages/compiler/dist
            apps/core/.wrangler/e2e-state-migrated
          if-no-files-found: error
          # The state sits under .wrangler.
          include-hidden-files: true
          # Only this run's parts read it, minutes after.
          retention-days: 1
          # Mostly minified code and wasm: the fastest level packs it
          # nearly as small.
          compression-level: 1

  # The journeys (playwright.config.ts) in parts, a runner and a stack
  # each, every part on the stack e2e-build built. Playwright runs a
  # project's dependencies in full on every shard, and the serial projects
  # (Grasp's go, the interviews, the journeys) depend on everything before
  # them, so `--shard` alone splits nothing: GRASP_E2E_PART picks the part.
  # The parallel part's Chromium tests run in parts, each the tests
  # scripts/e2e-parts.ts gives it by their times (scripts/e2e-durations.json),
  # test by test; its Firefox and WebKit tests in a part of their own; and
  # each serial project on a stack of its own, where nothing runs before
  # it, the journeys a file a stack (`--shard`). Fourteen parallel parts:
  # their tests take about a minute each, near the longest test's 82 s
  # (setup-voice.e2e.ts's story), after about a minute of setup and
  # starting the stack (November 2026). Add a parallel part by adding an
  # entry and raising the count in every entry's `part`. Part of the
  # required `check` (above).
  #
  # Not in the merge queue, here and in admin-e2e: the pull request's head
  # already passed every journey, and repeating them on main plus the batch
  # took 8 of the run's 28 jobs while the account runs at most 20 at once,
  # which halved how fast the queue merged (November 2026). The queue still
  # runs static, every test shard, workerd and the release build; the
  # nightly full run (nightly-alert, below) catches a journey two pull
  # requests break only together.
  #
  # On the runner itself, with Chromium's headless shell from e2e-build's
  # cache: the runner's image has the system packages Chromium needs.
  # Playwright's image took 28 s to start, and its own install 31 s, as the
  # install cache lives elsewhere in it (November 2026). Firefox and WebKit
  # need packages the runner lacks: their part caches them
  # (e2e-browsers, below).
  #
  # Only when the plan finds the change reaches its stack
  # (scripts/test-plan.ts, `journeysReached`): a change to the admin, the
  # router or Vitest's test files alone leaves what it runs as it was.
  e2e:
    name: e2e (${{ matrix.part }})
    needs: [plan, e2e-build]
    if: needs.plan.outputs.e2e == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # About 1 minute of setup and starting the stack, then each part's
    # tests.
    timeout-minutes: 15
    strategy:
      # A failing part doesn't cancel the others: each says what failed in
      # it.
      fail-fast: false
      matrix:
        include:
          - { part: 1/14, project: parallel, artifact: 1-of-14 }
          - { part: 2/14, project: parallel, artifact: 2-of-14 }
          - { part: 3/14, project: parallel, artifact: 3-of-14 }
          - { part: 4/14, project: parallel, artifact: 4-of-14 }
          - { part: 5/14, project: parallel, artifact: 5-of-14 }
          - { part: 6/14, project: parallel, artifact: 6-of-14 }
          - { part: 7/14, project: parallel, artifact: 7-of-14 }
          - { part: 8/14, project: parallel, artifact: 8-of-14 }
          - { part: 9/14, project: parallel, artifact: 9-of-14 }
          - { part: 10/14, project: parallel, artifact: 10-of-14 }
          - { part: 11/14, project: parallel, artifact: 11-of-14 }
          - { part: 12/14, project: parallel, artifact: 12-of-14 }
          - { part: 13/14, project: parallel, artifact: 13-of-14 }
          - { part: 14/14, project: parallel, artifact: 14-of-14 }
          - { part: onboarding, project: onboarding, artifact: onboarding }
          - { part: interview, project: interview, artifact: interview }
          - {
              part: journeys 1/3,
              project: journeys,
              shard: 1/3,
              artifact: journeys-1-of-3,
            }
          - {
              part: journeys 2/3,
              project: journeys,
              shard: 2/3,
              artifact: journeys-2-of-3,
            }
          - {
              part: journeys 3/3,
              project: journeys,
              shard: 3/3,
              artifact: journeys-3-of-3,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright-chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-stack
      # Beside the journeys, the runner's memory once a minute, as in the
      # test shards (scripts/memory-log.ts).
      - run: |
          node scripts/memory-log.ts &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          if [ "$GRASP_E2E_PART" = parallel ]; then
            node scripts/e2e-parts.ts "$PART" > "$RUNNER_TEMP/e2e-tests.txt"
            vp run e2e --project chromium --test-list "$RUNNER_TEMP/e2e-tests.txt" --reporter=github,json
          elif [ -n "$SHARD" ]; then
            vp run e2e --shard "$SHARD" --reporter=github,json
          else
            vp run e2e --reporter=github,json
          fi
        env:
          GRASP_E2E_PART: ${{ matrix.project }}
          GRASP_E2E_PREBUILT: "true"
          PART: ${{ matrix.part }}
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-results.json
      # Kept for passing runs too: the times the parts are split by come
      # from it (scripts/e2e-durations.ts).
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ matrix.artifact }}
          path: ${{ runner.temp }}/e2e-results.json
          if-no-files-found: ignore
          retention-days: 14
      # A failing test is retried with a trace (playwright.config.ts): keep it,
      # for a test that passed only when retried too, which passes the job:
      # kept only on failure, a flaky test's trace was lost with the runner.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One per part: a run's artifact names are unique.
          name: playwright-traces-${{ matrix.artifact }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The parallel part's Firefox and WebKit tests (playwright.config.ts's
  # browser policy tests), a part each, on the stack e2e-build built, on
  # the runner as e2e's parts. Each browser's build is cached by
  # Playwright's version, and the system packages it needs beyond the
  # runner's image as the .deb files apt fetched, by the image's version:
  # installing them from the Ubuntu mirror took up to 12 minutes when it
  # was slow (October 2026, GRA-1016), and Playwright's image, which has
  # them, took 55 s to start and install in (November 2026). When and why
  # as e2e, above.
  e2e-browsers:
    name: e2e (${{ matrix.browser }})
    needs: [plan, e2e-build]
    if: needs.plan.outputs.e2e == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: playwright
        run: |
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: vp exec playwright install "$BROWSER"
      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # An older image's files when this one's are missing: most of what
      # apt needs, and it fetches the rest.
      - id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/playwright-debs
          key: playwright-debs-${{ matrix.browser }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
          restore-keys: playwright-debs-${{ matrix.browser }}-
      # apt finds the cached files in its own archive and fetches only what
      # they lack, and keeps what it fetched, so the cache can be saved
      # with it.
      - run: |
          shopt -s nullglob
          mkdir -p ~/playwright-debs
          echo 'Binary::apt-get::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-downloads > /dev/null
          debs=(~/playwright-debs/*.deb)
          if [ ${#debs[@]} -gt 0 ]; then
            sudo cp "${debs[@]}" /var/cache/apt/archives/
          fi
          vp exec playwright install-deps "$BROWSER"
          fetched=(/var/cache/apt/archives/*.deb)
          if [ ${#fetched[@]} -gt 0 ]; then
            cp "${fetched[@]}" ~/playwright-debs/
          fi
      - if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/playwright-debs
          key: playwright-debs-${{ matrix.browser }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-stack
      - run: vp run e2e --project "$BROWSER" --reporter=github,json
        env:
          GRASP_E2E_PART: parallel
          GRASP_E2E_PREBUILT: "true"
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-results.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results-${{ matrix.browser }}
          path: ${{ runner.temp }}/e2e-results.json
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The admin's journeys (playwright.admin.config.ts): a stack of their
  # own, the admin on the fake Cloudflare API, so apart from e2e's, in
  # parts (`--shard`), a stack each: one after another they took 4
  # minutes (November 2026). Chromium only, on the runner, as e2e's
  # parts. Only when the plan finds the change reaches the admin
  # (scripts/test-plan.ts, `journeysReached`). Skipped so, `check` passes
  # it, and fails the run when the plan itself failed.
  admin-e2e:
    name: admin-e2e (${{ matrix.shard }})
    # Not in the merge queue, as e2e above.
    needs: plan
    if: needs.plan.outputs['admin-e2e'] == 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright-chromium
      - run: vp run e2e:admin --shard "$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
      # A failing journey keeps its trace (playwright.admin.config.ts).
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-playwright-traces-${{ strategy.job-index }}
          path: test-results/
          retention-days: 14

  # On-prem ready: core must boot on plain workerd.
  workerd:
    name: workerd
    if: github.event_name != 'push' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run --filter @grasp-os/web build
      - run: vp run smoke:workerd
      # Code Mode's executor, with a Worker Loader, on plain workerd.
      - run: vp run smoke:code-mode

  # Builds a release bundle as main will publish it (core, connect, the
  # frontend's static files and D1 migrations, with its manifest) and checks
  # every blob against the manifest, and builds the admin, which isn't part
  # of a release. For a pull request or the merge queue, that's all, and
  # it's the run's only build: part of the required `check` (above). On a
  # push to main it's the commit's only build too: the bundle
  # is the run's `release` artifact, which publish-release publishes as
  # it is, so the release an admin rolls out is the one CI tested, byte
  # for byte.
  release:
    name: release
    # Not for a draft; a push to main has no pull request.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On a push to main, saves node_modules when its cache missed, for
      # every pull request after.
      - uses: ./.github/actions/setup
        with:
          save: ${{ github.event_name == 'push' }}
      - run: vp run release:build --out release-out
      # The admin isn't part of a release (see Deploy platform): check that
      # it builds, for each stage, into a Worker cf would deploy
      # (cloudflare.config.ts). Vite records the stage as its mode, which
      # the deploy names again. No credentials needed.
      - if: github.event_name != 'push'
        run: |
          set -euo pipefail
          for stage in staging production; do
            vp build --mode "$stage"
            vp exec cf deploy --prebuilt --mode "$stage" --dry-run
          done
        working-directory: apps/admin
      # The builds above regenerate the route trees, which must be committed
      # (static checks the other generated files without building).
      - if: github.event_name != 'push'
        run: git diff --exit-code -- '*routeTree.gen.ts'
      # Every file but the build's `.grasp-release` marker, which only
      # release:build reads. The download checks the artifact's digest, and
      # each job that uses it checks every file against the manifest again.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release-out/
          if-no-files-found: error
          retention-days: 14

  # Every push to main deploys staging's platform (the admin, router and
  # connect gateway) with the Deploy platform workflow, the same steps a
  # run by hand takes, in staging's GitHub and 1Password environments.
  # Before publish-release: the staging admin imports a release from its
  # bucket within 5 minutes of its publish (apps/admin/wrangler.jsonc), so
  # the admin that imports and rolls out a release is always at least as
  # new as the release, and a release that needs an admin change never
  # meets the old admin. A deploy that fails holds the release back, and
  # the run goes red. One staging platform deploy at a time, by hand or
  # from here: the job's own concurrency group (deploy-platform-staging),
  # apart from this run's, waits for one deploying and replaces one still
  # waiting.
  deploy-platform:
    name: deploy-platform
    needs: release
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-platform.yml
    # A called workflow sees only the secrets its caller hands it, the
    # staging environment's OP_SERVICE_ACCOUNT_TOKEN included.
    secrets: inherit
    with:
      stage: staging

  # Every merge to main is a release: built once (the release job),
  # verified against its manifest and published to staging's releases
  # bucket, where the staging admin imports it and rolls it out to
  # staging's clients. It publishes the release job's bundle, never a build
  # of its own, and deploys nothing. Production's admin never sees it until
  # someone promotes it, once staging ran it, with the Promote release
  # workflow. The bucket's name comes from the names module
  # (scripts/platform-names.ts). Secrets and settings come from the staging
  # 1Password Environment, never from GitHub: OP_SERVICE_ACCOUNT_TOKEN, the
  # staging GitHub environment's read-only service account token, is the
  # only value kept there (.github/actions/load-1password). The R2 key is
  # passed only to the steps that use it; all steps share one runner, so
  # that isn't a security boundary.
  # Pushes to main share the workflow's concurrency group, which keeps only
  # the newest pending run: in a burst of merges a middle commit may never
  # be published, and its changes ship in the next release.
  publish-release:
    name: publish-release
    needs: [release, deploy-platform]
    # Only for main's head, together with its platform deploy: a push main
    # has moved past publishes nothing, and the newer push's release carries
    # its changes (Deploy platform, `head`).
    if: github.event_name == 'push' && needs.deploy-platform.outputs.current == 'true'
    # It holds the staging 1Password token: GitHub-hosted runners only, so
    # no secret leaves GitHub's machines.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Staging's releases bucket and the account's R2 endpoint, by the names
      # module, for every step after: the release goes to it.
      - run: |
          set -euo pipefail
          echo "R2_BUCKET=$(vp exec node scripts/platform-names.ts staging releasesBucket)" >> "$GITHUB_ENV"
          echo "R2_ENDPOINT=$(vp exec node scripts/platform-names.ts staging r2Endpoint)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release-out
      - uses: ./.github/actions/load-1password
        with:
          environment: staging
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          secrets: R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY
          required: R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY
      # Published under the month's next id (`YY.MM.N`, from the bucket;
      # @grasp-os/shared/release-id): only the manifest's id changes from
      # the release job's bundle, never a blob.
      - run: vp run release:upload --release release-out --assign-id

  # When the nightly full run fails, an issue says so: nobody watches the
  # Actions tab at 02:17, and the merge queue no longer runs the journeys
  # (e2e, above), so this run is where a break between two pull requests
  # shows. One open issue at a time: a later failure comments on it.
  # Only the nightly run, and not when it was cancelled.
  nightly-alert:
    name: nightly-alert
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - run: |
          set -euo pipefail
          title="Nightly CI failed on main"
          failed=$(gh run view "$RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | select(.name != "check") | "- \(.name)"')
          green=$(gh run list --workflow ci.yml --event schedule --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          range="no green nightly run to compare with"
          [ -z "$green" ] || range="$SERVER/$GH_REPO/compare/$green...$GITHUB_SHA"
          printf 'Run: %s\n\nFailed jobs:\n%s\n\nCommits since the last green nightly run: %s\n' \
            "$SERVER/$GH_REPO/actions/runs/$RUN_ID" "${failed:-"- (none listed)"}" "$range" > body.md
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER: ${{ github.server_url }}
