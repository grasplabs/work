# Trunk-based: feature branch -> pull request into main -> merge queue, which
# tests it on top of the latest main and squash-merges it. Checks run on pull
# requests and in the merge queue; a push to main only deploys what those
# checks already tested, to grasp-os-staging, and once that succeeds
# publishes it as a release for the console. grasp-os-ops is deployed by hand
# with the Deploy grasp-os-ops workflow. Jobs with secrets never run for pull
# requests from forks. CI never deploys to a client account: the console
# rolls releases out.
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  check:
    name: check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # A passing run takes 9 to 12 minutes, most of it `vp test`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check:migrations compares with origin/main.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp check
      - run: vp run check:secrets
      - run: vp run check:docs
      - run: vp run check:migrations
      - run: vp run check:wrangler-configs
      # 8 to 10.5 minutes when it passes. Vitest's default runs a worker per
      # CPU but one, which left a third of the runner's CPU idle; a worker
      # per CPU measured about 6% faster.
      # Vitest times a test out from inside its worker, so a worker that is
      # blocked, or whose request workerd cancelled, never reports its test.
      # The stall reporter (scripts/stall-reporter.ts) names such a test or
      # file and ends the run once it is well past its timeout. A hang
      # outside any test (teardown, shutting the pool down) fails at this
      # step's timeout after 16 minutes, instead of at the job's limit: half
      # again over the slowest pass. A minute before that, the reporter
      # prints the files and tests still running, and each finished test is
      # in the test-progress artifact. "0 files, 0 tests" there means the
      # hang is in teardown or in shutting the pool down. A run that doesn't
      # pass says why in the step summary and as an annotation: the
      # reporter's verdict, or Vitest's failed files and unhandled errors
      # (a worker that exits shows as one), with the runner's memory.
      # Reporters given here replace Vitest's defaults, so github-actions is
      # listed for the inline failure annotations.
      - run: vp test --maxWorkers=100% --reporter=default --reporter=github-actions --reporter=./scripts/stall-reporter.ts
        timeout-minutes: 16
        env:
          GRASP_STALL_REPORT_AFTER_MINUTES: 15
          # Seconds past a test's own timeout (counted for each attempt):
          # room for the hooks around it, which have timeouts of their own.
          # The longest is 120 s, set by workerflow's process tests
          # (packages/workerflow/vite.process.config.ts); the rest use
          # Vitest's 10 s. 300 s covers that 120 s before and after a test,
          # with headroom for a loaded runner. Only lower it below twice the
          # longest hook timeout if that drops.
          GRASP_TEST_OVERDUE_GRACE_SECONDS: 300
          GRASP_TEST_PROGRESS_FILE: ${{ runner.temp }}/test-progress.log
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-progress
          path: ${{ runner.temp }}/test-progress.log
          if-no-files-found: ignore
          retention-days: 14
      # What the runner looked like when the job failed: its memory, the
      # processes holding the most (workerd left running shows here), and
      # any process the kernel killed for memory, which ends a step with
      # nothing of its own to say.
      - if: failure()
        run: |
          free -m
          ps -eo pid,ppid,rss,etime,args --sort=-rss | head -n 15 | cut -c 1-200
          sudo dmesg --ctime | grep -iE 'out of memory|oom-kill|killed process' || echo "The kernel killed no process for memory."
      - run: vp run -r build
      # The console isn't deployed from here (see deploy-staging): check that
      # its build is a Worker wrangler would deploy. No credentials needed.
      - run: vp exec wrangler deploy --dry-run
        working-directory: apps/console
      # Generated files (Worker types, route trees, migrations, the
      # frontend's translation catalogs) must be committed.
      - run: vp run -r typegen && vp run -r db:generate && vp run -r i18n:extract
      - run: git diff --exit-code && test -z "$(git status --porcelain)"

  e2e:
    name: e2e
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      # Firefox and WebKit run only the attacks on a screen's frame
      # (playwright.config.ts): the sandbox is each browser's own.
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp run e2e
      # A failing test is retried with a trace (playwright.config.ts): keep it.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # On-prem ready: core must boot on plain workerd.
  workerd:
    name: workerd
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run --filter @grasp-os/web build
      - run: vp run smoke:workerd
      # Code Mode's executor, with a Worker Loader, on plain workerd.
      - run: vp run smoke:code-mode

  # Builds a release bundle as main will publish it (core, connect, the
  # frontend's static files and D1 migrations, with its manifest) and checks
  # every blob against the manifest. Nothing is uploaded.
  release:
    name: release
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run release:build --out release-out

  # The branch name and the PR title, which becomes the commit on main and the
  # release note. Skipped (which counts as passing) in the merge queue.
  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run check:branch
      - run: printf '%s\n' "$PR_TITLE" | vp exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # Secrets come from 1Password: one service account per environment, each
  # limited to its own vault, its token stored as a GitHub environment secret.
  deploy-staging:
    name: deploy-staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: grasp-os-staging
    concurrency:
      group: deploy-grasp-os-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://grasp-os-staging/cloudflare/account-id
          CLOUDFLARE_API_TOKEN: op://grasp-os-staging/cloudflare/api-token
      - run: vp run --filter @grasp-os/web build
      # A D1 database's jurisdiction is set only when it is created, and deploy
      # would auto-provision a missing one outside the EU: create every
      # database a deployed app binds (see each wrangler.jsonc) before the
      # first deploy. One that exists outside the EU stops the deploy; it has
      # to be recreated.
      - name: Create the D1 databases in the EU
        run: |
          existing=$(vp exec wrangler d1 list --json)
          for db in grasp-os-core grasp-os-knowledge grasp-os-connect; do
            jurisdiction=$(jq -r --arg db "$db" '.[] | select(.name == $db) | .jurisdiction // "none"' <<< "$existing")
            if [ -z "$jurisdiction" ]; then
              vp exec wrangler d1 create "$db" --jurisdiction eu
            elif [ "$jurisdiction" != "eu" ]; then
              echo "::error::D1 database $db is not in the EU jurisdiction ($jurisdiction)"
              exit 1
            fi
          done
      # A bucket's jurisdiction, too, is set only when it is created: create
      # the audit archive (core's AUDIT_ARCHIVE) in the EU before the first
      # deploy.
      - name: Create the audit archive bucket in the EU
        run: vp exec wrangler r2 bucket info grasp-os-audit-archive --jurisdiction eu || vp exec wrangler r2 bucket create grasp-os-audit-archive --jurisdiction eu
      # D1 migrations are additive, so the running code keeps working on the
      # new schema until the deploy after them replaces it. connect first:
      # core's service binding points at it.
      - run: vp run --filter @grasp-os/connect db:migrate
      - run: vp run --filter @grasp-os/connect deploy
      - run: vp run --filter @grasp-os/core db:migrate
      - run: vp run --filter @grasp-os/core deploy
      # The console is deliberately not deployed to staging: it has no route
      # there and refuses every request without an Access application
      # (apps/console/src/access.ts). It deploys only to grasp-os-ops, with
      # deploy-ops. A real staging console would need a route and its own
      # Access application first. The check job still proves it builds.

  # The router on its own: its deploy needs the account's Secrets Store
  # (scripts/wrangler-deploy.ts), and an account not set up for it yet
  # mustn't hold back core and connect, nor publishing, which waits only
  # for deploy-staging. It isn't part of a release.
  deploy-staging-router:
    name: deploy-staging-router
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: grasp-os-staging
    concurrency:
      group: deploy-grasp-os-staging-router
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://grasp-os-staging/cloudflare/account-id
          CLOUDFLARE_API_TOKEN: op://grasp-os-staging/cloudflare/api-token
      - run: vp run --filter @grasp-os/router deploy

  # Every merge to main is a release: built once, verified against its
  # manifest and published to R2 in grasp-os-ops, where the console imports
  # it. Deploys nothing itself, and runs only once deploy-staging has
  # deployed the same commit (this run's): a commit whose staging migrations
  # or deploys fail is never published, so the console can't roll it out to
  # a client. When deploy-staging fails, is cancelled or is skipped, this job
  # is skipped too, and the commit's changes ship in the next release that
  # passes staging. The R2 key is loaded after the build and passed only to
  # the upload step, which keeps it out of the build's environment; all
  # steps share one runner, so that isn't a security boundary. Skipped until
  # the repository variable PUBLISH_RELEASES is `true`, set once the bucket,
  # key and environment exist, and staging deploys. Pushes to main share the
  # workflow's concurrency group, which keeps only the newest pending run: in
  # a burst of merges a middle commit may never be published, and its
  # changes ship in the next release.
  publish-release:
    name: publish-release
    needs: deploy-staging
    if: github.event_name == 'push' && vars.PUBLISH_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: grasp-os-releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run release:build --out release-out
      - id: r2
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          R2_ENDPOINT: op://grasp-os-releases/r2/endpoint
          R2_ACCESS_KEY_ID: op://grasp-os-releases/r2/access-key-id
          R2_SECRET_ACCESS_KEY: op://grasp-os-releases/r2/secret-access-key
      - run: vp run release:upload --release release-out
        env:
          R2_ENDPOINT: ${{ steps.r2.outputs.R2_ENDPOINT }}
          R2_BUCKET: grasp-os-releases
          R2_ACCESS_KEY_ID: ${{ steps.r2.outputs.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ steps.r2.outputs.R2_SECRET_ACCESS_KEY }}
