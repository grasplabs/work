# Deploys the admin, router and connect gateway to Grasp's Cloudflare
# account: the admin holds a token for every client, so it never changes on
# a merge. Run it by hand from main, once with stage "staging"
# (grasp-admin-staging, grasp-router-staging and
# grasp-connect-gateway-staging, serving grasp-clients-staging), then with
# "production" once the change works there. Every name comes from
# @grasp-os/shared/names. Each stage runs in the GitHub environment of its
# name and reads the 1Password Environment of the same name: production
# requires a second person to approve every run; staging, which CI also
# publishes releases from on every merge, doesn't.
#
# Every secret lives in the stage's 1Password Environment, by its plain
# name. Every run first copies the runtime secrets the stage's admin and
# router bind into the account's Secrets Store (scripts/store-secrets.ts),
# each under its stage's name (`storeSecretName`: `_STAGING` appended in
# staging, so a staging run never writes what production reads); the
# admin and router read them there, and the admin sets them on each
# client's Workers. Run it with "secrets only" after rotating one in
# 1Password to copy it without deploying; a secrets rollout from the admin
# then takes it to every client. The master keys (ROUTER_KEY, CLIENT_KEY)
# are the exception: a copy creates them but never replaces them, and
# stops when 1Password's value no longer matches the store's, since
# rotating one is a procedure of its own (scripts/store-secrets-lib.ts). The account and store ids come from the
# names module, and the admin's settings are its wrangler.jsonc vars, per
# stage.
name: Deploy platform

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Which platform to deploy
        type: choice
        options: [staging, production]
        default: staging
      secrets-only:
        description: Only copy the secrets from 1Password to Secrets Store; deploy nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-platform-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy-platform:
    name: deploy-platform
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      # The stage's Cloudflare API token, from its 1Password Environment:
      # OP_SERVICE_ACCOUNT_TOKEN, the environment's secret, is the only value
      # kept in GitHub.
      - uses: ./.github/actions/load-1password
        with:
          environment: ${{ inputs.stage }}
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          secrets: CLOUDFLARE_API_TOKEN
          required: CLOUDFLARE_API_TOKEN
      # Grasp Work's account and its one Secrets Store, by the names module.
      - run: |
          set -euo pipefail
          echo "CLOUDFLARE_ACCOUNT_ID=$(vp exec node scripts/platform-names.ts "$STAGE" accountId)" >> "$GITHUB_ENV"
          echo "SECRETS_STORE_ID=$(vp exec node scripts/platform-names.ts "$STAGE" secretsStoreId)" >> "$GITHUB_ENV"
      # Every secret the stage's admin and router bind, by the name
      # 1Password keeps: what's loaded right below, and cleared after.
      - id: secrets
        run: echo "names=$(vp exec node scripts/store-secrets.ts names "$STAGE")" >> "$GITHUB_OUTPUT"
      # Loaded right before the copy and cleared right after, so no deploy
      # sees them. Not required here: the copy itself stops on a required
      # one that's missing, naming it, before it writes anything, and skips
      # an optional one, leaving the store's as it is.
      - uses: ./.github/actions/load-1password
        with:
          environment: ${{ inputs.stage }}
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          secrets: ${{ steps.secrets.outputs.names }}
      - name: Copy the secrets to Secrets Store
        run: vp exec node scripts/store-secrets.ts copy "$STAGE"
      - name: Clear the secrets from the job's env
        if: always()
        env:
          NAMES: ${{ steps.secrets.outputs.names }}
        run: |
          for name in $NAMES; do
            echo "$name=" >> "$GITHUB_ENV"
          done
      # A D1 database's jurisdiction is set only when it is created, and deploy
      # would auto-provision a missing one outside the EU: create the
      # admin's database before its first deploy. One that exists outside
      # the EU stops the deploy; it has to be recreated.
      - name: Create the admin database in the EU
        if: ${{ !inputs.secrets-only }}
        # The admin's database, deploy and migrations go through Cloudflare's
        # cf CLI (the admin's dev dependency, apps/admin/cloudflare.config.ts),
        # with the job's token.
        working-directory: apps/admin
        run: |
          set -euo pipefail
          db=$(vp exec node ../../scripts/platform-names.ts "$STAGE" adminDatabase)
          jurisdiction=$(vp exec cf d1 list --name "$db" | jq -r --arg db "$db" '.[] | select(.name == $db) | .jurisdiction // "none"')
          if [ -z "$jurisdiction" ]; then
            vp exec cf d1 create --name "$db" --jurisdiction eu > /dev/null
          elif [ "$jurisdiction" != "eu" ]; then
            echo "::error::D1 database $db is not in the EU jurisdiction ($jurisdiction)"
            exit 1
          fi
      # D1 migrations are additive, so the running admin keeps working on
      # the new schema until the deploy after them replaces it. Recorded in
      # d1_migrations, as Wrangler records them.
      - if: ${{ !inputs.secrets-only }}
        working-directory: apps/admin
        run: |
          set -euo pipefail
          db=$(vp exec node ../../scripts/platform-names.ts "$STAGE" adminDatabase)
          id=$(vp exec cf d1 list --name "$db" | jq -r --arg db "$db" '.[] | select(.name == $db) | .uuid')
          vp exec cf d1 migrations apply "$id" --dir src/db/migrations --table d1_migrations > /dev/null
      # Router first: both bind the stage's hostname map, which
      # scripts/cloudflare-account-setup.ts creates, and the account's Secrets Store
      # (scripts/wrangler-deploy.ts fills in both ids). So a router deploy
      # that fails stops the admin's too. Besides Workers Scripts, D1 and
      # Secrets Store, the job's token needs Workers KV Storage (read, to
      # find the map) and Workflows (edit: the admin's deploy registers
      # its provisioning Workflow).
      - if: ${{ !inputs.secrets-only }}
        working-directory: apps/router
        run: vp exec node ../../scripts/wrangler-deploy.ts --stage "$STAGE"
      # The connect gateway (apps/gateway, GRA-1217), next to the router:
      # every placed client's core reaches its own connect in its stage's
      # dispatch namespace through it. The admin only binds placed cores to
      # it, so deploying it changes nothing for anyone until it does.
      - if: ${{ !inputs.secrets-only }}
        working-directory: apps/gateway
        run: vp exec node ../../scripts/wrangler-deploy.ts --stage "$STAGE"
      # The admin's settings are its wrangler.jsonc vars, per stage; a stage
      # without its Access application (CF_ACCESS_AUD and CF_ACCESS_ISS),
      # which would lock staff out, isn't deployed (apps/admin/cf-worker.ts).
      - name: Deploy the admin
        if: ${{ !inputs.secrets-only }}
        run: |
          set -euo pipefail
          # What apps/admin/cf-worker.ts fills in: the store, the stage's
          # hostname map, and the secrets the store has (an optional one it
          # lacks stays unbound).
          cd apps/admin
          hosts=$(vp exec node ../../scripts/platform-names.ts "$STAGE" routerHosts)
          ROUTER_HOSTS_ID=$(vp exec cf kv namespaces list --per-page 100 | jq -r --arg title "$hosts" '[.[] | select(.title == $title) | .id] | if length == 1 then .[0] else error("expected one KV namespace " + $title) end')
          STORED_SECRETS=$(vp exec cf secrets-store secrets list --store-id "$SECRETS_STORE_ID" --per-page 100 | jq -r '[.[].name] | join(",")')
          export ROUTER_HOSTS_ID STORED_SECRETS
          # Built for the stage (Vite's mode, which cloudflare.config.ts
          # reads), then that build deployed with cf, naming the same mode.
          vp build --mode "$STAGE"
          vp exec cf deploy --prebuilt --mode "$STAGE" --message "deploy-platform $GITHUB_SHA"
