# The branch name, the PR title, which becomes the commit on main and the
# release note, and the attribution of the squash commit: the PR
# description, which becomes its body, and the PR's commits, whose
# co-authors GitHub adds to it. Apart from CI so that editing the title or
# the description runs it again. The required `conventions` check is
# skipped (which counts as passing) in the merge queue.
name: Conventions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR's commits, from its base to its head.
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - run: vp run check:branch
      - run: printf '%s\n' "$PR_TITLE" | vp exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - run: |
          { printf '%s\n' "$PR_BODY"; git log --format=%B "$BASE..$HEAD"; } |
            node scripts/check-attribution.ts
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
