# Temporary (GRA-554): reproduces the package-build stall on CI's runners
# and compares runtimes with and without V8's background JavaScript
# compilation. Removed before this pull request merges.
name: Stall probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'fix/package-builds-stall'
    name: probe (${{ matrix.variant }} ${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, no-background-compile]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Install gdb for stall stack dumps
        continue-on-error: true
        timeout-minutes: 3
        run: |
          command -v gdb || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gdb)
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Copies of the build-heavy files, to run many builds in one runtime
        run: |
          for copy in a b c; do
            cp apps/core/test/package-builds.test.ts "apps/core/test/package-builds-$copy.test.ts"
            cp apps/core/test/package-artifacts.test.ts "apps/core/test/package-artifacts-$copy.test.ts"
          done
      - name: Run the build-heavy files until one stalls or time is up
        timeout-minutes: 27
        env:
          GRASP_TEST_OVERDUE_GRACE_SECONDS: 120
          GRASP_STALL_DUMP_STACKS: gdb
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = no-background-compile ]; then
            export MINIFLARE_WORKERD_V8_FLAGS="--no-concurrent-recompilation --no-concurrent-sparkplug"
          fi
          # Load like the other projects that share the runner in CI.
          for i in 1 2; do (while :; do :; done) & done
          end=$(( $(date +%s) + 22 * 60 ))
          run=0
          while [ "$(date +%s)" -lt "$end" ]; do
            run=$((run + 1))
            start=$(date +%s)
            set +e
            vp test apps/core/test/package-builds*.test.ts apps/core/test/package-artifacts*.test.ts apps/core/test/packages.test.ts --maxWorkers=2 --reporter=dot --reporter=./scripts/stall-reporter.ts > "run-$run.log" 2>&1
            status=$?
            set -e
            echo "run $run status=$status secs=$(( $(date +%s) - start )) $(grep -E 'Tests +[0-9]' "run-$run.log" | tail -1)"
            if grep -q "Ending the run" "run-$run.log"; then
              echo "::error::run $run stalled"
              grep -A 400 "Ending the run" "run-$run.log" | head -c 300000
              exit 1
            fi
          done
