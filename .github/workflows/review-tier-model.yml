# A model's reading of each pull request's diff (scripts/review-tier-model.ts),
# which may only raise the labels the Review tier workflow sets. In shadow
# mode for now: it writes what it would set to the run's summary and an
# artifact, and changes no label, until its verdicts have been compared with
# how the reviews went (GRA-1125).
#
# `pull_request_target`, with main checked out: nothing of the PR runs, and
# only its files and patches reach the model, never its title or body. That
# trigger gives secrets to forks' PRs too, so the job's `if:` is what keeps
# them out. The key is a secret of the review-tier environment itself, not
# of 1Password, which holds the platform's secrets: it is repository
# tooling's, with a spend limit of its own, and the environment deploys
# from main only. Only the one step that calls the model sees it, and the
# job may only read, so it never sits beside a write token.
#
# A workflow of its own, so a title edit, which reruns the labels, never
# cancels a verdict being paid for. Not for drafts, which are pushed often
# and reviewed once ready.
name: Review tier (model)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: review-tier-model-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  model:
    name: review tier (model, shadow)
    if: >-
      !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shadow mode: a failure here never blocks a pull request.
    continue-on-error: true
    environment: review-tier
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Ask the model
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | {filename, previous_filename, additions, deletions, patch}' \
            | node scripts/review-tier-model.ts > "$RUNNER_TEMP/review-tier-model.json"
          {
            jq -r '"### Model (shadow): would label Complexity: \(.labels.complexity)\(if .labels.security then ", Security" else "" end)"' "$RUNNER_TEMP/review-tier-model.json"
            echo
            jq -r '"Floor: \(.floor.complexity)\(if .floor.security then ", Security" else "" end). Model: \(.model.complexity)\(if .model.security then ", Security" else "" end), $\(.model.cost * 1000 | round / 1000)."' "$RUNNER_TEMP/review-tier-model.json"
            echo
            jq -r '.model.votes | to_entries[] | "- Vote \(.key + 1): \(.value.complexity), \(if .value.security then "Security" else "not Security" end). \(.value.complexity_reason) \(.value.security_reason)"' "$RUNNER_TEMP/review-tier-model.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-tier-model
          path: ${{ runner.temp }}/review-tier-model.json
          retention-days: 90
