# Vite+, Node.js and the workspace's installed dependencies: every job's
# setup but the journeys' (their image packs caches another way, see e2e in
# ci.yml). The installed node_modules are cached whole, by the lockfile:
# restoring them skips the install, which with pnpm's store restored (still
# restored, for the tests that install offline from it) linked 1,200
# packages, checked the lockfile against the supply-chain
# policies over the network and ran the build scripts, about 25 s of each
# job's 39 s setup (October 2026). A lockfile the cache hasn't seen installs
# from the pnpm store's cache as before, and checks its policies.
#
# The store is cached here, not by setup-vp's `cache`, so it is saved with
# node_modules, by the same install. setup-vp saved it after the job, and
# only when the job passed, from whatever store the job had: a job that
# failed after saving node_modules left them without their store, and the
# next run, restoring those, saved an older lockfile's store (its fallback)
# under this lockfile's key, so tests installing offline from it failed
# (November 2026). Now node_modules are restored only beside the store their
# lockfile installed, and a store is saved only by the install that filled it.
#
# Only a job that says so saves a cache it missed: `plan` for a pull
# request, which runs before the test shards, so they hit what it saved,
# and `release` on a push to main, whose caches every pull request can
# read. Every job saving would have them all pack the same 2 GB at once,
# for one to win.
#
# Then oxc.wasm, which the compiler builds in (.github/actions/oxc-wasm),
# with no token: every workflow that sets up can build.
name: Set up
description: Install Vite+ and Node.js, restore or install node_modules, and download oxc.wasm

inputs:
  save:
    description: "Save node_modules and pnpm's store when their cache missed: true or false"
    default: "false"
  oxc-wasm:
    description: "Download oxc.wasm, for a job that builds or tests the compiler: true or false"
    default: "true"

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-version-file: .node-version
        cache: false
        run-install: false
    - id: keys
      shell: bash
      run: |
        echo "store-path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"
        echo "store=pnpm-store-$RUNNER_OS-$RUNNER_ARCH-$LOCKFILE_HASH" >> "$GITHUB_OUTPUT"
        echo "modules=node-modules-$RUNNER_OS-$RUNNER_ARCH-$MODULES_HASH" >> "$GITHUB_OUTPUT"
      env:
        LOCKFILE_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
        MODULES_HASH: ${{ hashFiles('.node-version', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/connectors/*/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
    # An older lockfile's store when this one's is missing: most of what the
    # install needs, and it fetches the rest.
    - id: store
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.store-path }}
        key: ${{ steps.keys.outputs.store }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    # Every node_modules of the workspace's packages (pnpm-workspace.yaml):
    # each holds links into the root's virtual store. Only beside this
    # lockfile's own store: with an older one, an install that found
    # node_modules up to date wouldn't fetch what the store lacks.
    - id: modules
      if: steps.store.outputs.cache-hit == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          packages/connectors/*/node_modules
        key: ${{ steps.keys.outputs.modules }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: vp install --frozen-lockfile
    # The store first: node_modules saved without it are what broke before.
    - if: steps.modules.outputs.cache-hit != 'true' && steps.store.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.store-path }}
        key: ${{ steps.keys.outputs.store }}
    - if: steps.modules.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          packages/connectors/*/node_modules
        key: ${{ steps.keys.outputs.modules }}
    - if: inputs.oxc-wasm == 'true'
      uses: ./.github/actions/oxc-wasm
