# Vite+, Node.js and the workspace's installed dependencies: every job's
# setup, the journeys' too. The installed node_modules are cached whole, by
# the lockfile:
# restoring them skips the install, which with pnpm's store restored (still
# restored, for the tests that install offline from it) linked 1,200
# packages, checked the lockfile against the supply-chain
# policies over the network and ran the build scripts, about 25 s of each
# job's 39 s setup (October 2026). A lockfile the cache hasn't seen installs
# from the pnpm store's cache as before, and checks its policies.
#
# The store is cached here, not by setup-vp's `cache`, so it is saved with
# node_modules, by the same install. setup-vp saved it after the job, and
# only when the job passed, from whatever store the job had: a job that
# failed after saving node_modules left them without their store, and the
# next run, restoring those, saved an older lockfile's store (its fallback)
# under this lockfile's key, so tests installing offline from it failed
# (November 2026). Now node_modules are restored only beside the store their
# lockfile installed, and a store is saved only by the install that filled it.
#
# Only the tests that install offline read the store
# (scripts/package-definition.test.ts): a job that runs none passes
# `store: false` and restores node_modules alone, about 9 s sooner, and
# the store only to install when node_modules missed.
#
# Only a job that says so saves a cache it missed: `static` for a pull
# request, so the pull request's next run hits it, and `release` on a
# push to main, whose caches every pull request can read. Every job saving
# would have them all pack the same 2 GB at once, for one to win.
#
# Then oxc.wasm, which the compiler builds in (.github/actions/oxc-wasm),
# with no token: every workflow that sets up can build.
name: Set up
description: Install Vite+ and Node.js, restore or install node_modules, and download oxc.wasm

inputs:
  save:
    description: "Save node_modules and pnpm's store when their cache missed: true or false"
    default: "false"
  store:
    description: "Restore pnpm's store even when node_modules hit, for tests that install offline from it: true or false"
    default: "true"
  oxc-wasm:
    description: "Download oxc.wasm, for a job that builds or tests the compiler: true or false"
    default: "true"

runs:
  using: composite
  steps:
    # Vite+'s own installation (vp, its shims and Node.js), cached by the
    # versions of all three: setup-vp reuses an installed exact version
    # instead of running its installer, which fetched vp from npm in every
    # job, about 4 s of its 6.5 s (November 2026; pingdotgg/t3code caches it
    # the same way). An entry never changes, hence every version in its key.
    - id: vp-versions
      shell: bash
      run: |
        echo "key=vite-plus-home-$RUNNER_OS-$RUNNER_ARCH-$(sed -nE 's/^  vite-plus: ([0-9][^ ]*)$/\1/p' pnpm-workspace.yaml)-node$(cat .node-version)-$(jq -r .packageManager package.json | cut -d + -f 1)" >> "$GITHUB_OUTPUT"
    - id: vp-home
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.local/share/vite-plus
          ~/.config/vite-plus
        key: ${{ steps.vp-versions.outputs.key }}
    - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-version-file: .node-version
        cache: false
        run-install: false
    - if: steps.vp-home.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.local/share/vite-plus
          ~/.config/vite-plus
        key: ${{ steps.vp-versions.outputs.key }}
    - id: keys
      shell: bash
      run: |
        echo "store-path=$(vp pm cache dir)" >> "$GITHUB_OUTPUT"
        echo "store=pnpm-store-$RUNNER_OS-$RUNNER_ARCH-$LOCKFILE_HASH" >> "$GITHUB_OUTPUT"
        echo "modules=node-modules-$RUNNER_OS-$RUNNER_ARCH-$MODULES_HASH" >> "$GITHUB_OUTPUT"
      env:
        LOCKFILE_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
        MODULES_HASH: ${{ hashFiles('.node-version', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'packages/connectors/*/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
    # An older lockfile's store when this one's is missing: most of what the
    # install needs, and it fetches the rest. Before node_modules for a job
    # that reads the store: they are restored only beside this lockfile's
    # own store, as with an older one an install that found node_modules
    # up to date wouldn't fetch what the store lacks.
    - id: store-first
      if: inputs.store == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.store-path }}
        key: ${{ steps.keys.outputs.store }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    # Every node_modules of the workspace's packages (pnpm-workspace.yaml):
    # each holds links into the root's virtual store.
    - id: modules
      if: inputs.store != 'true' || steps.store-first.outputs.cache-hit == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          packages/connectors/*/node_modules
        key: ${{ steps.keys.outputs.modules }}
    # A job that doesn't read the store needs it only to install.
    - id: store-late
      if: inputs.store != 'true' && steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.store-path }}
        key: ${{ steps.keys.outputs.store }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: vp install --frozen-lockfile
    # The store first: node_modules saved without it are what broke before.
    - if: steps.modules.outputs.cache-hit != 'true' && steps.store-first.outputs.cache-hit != 'true' && steps.store-late.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.store-path }}
        key: ${{ steps.keys.outputs.store }}
    - if: steps.modules.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          packages/connectors/*/node_modules
        key: ${{ steps.keys.outputs.modules }}
    - if: inputs.oxc-wasm == 'true'
      uses: ./.github/actions/oxc-wasm
