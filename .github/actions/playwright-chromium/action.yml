# Chromium's headless shell for the journeys, on the runner itself, whose
# image has the system packages it needs: restored from the cache by the
# installed Playwright's version, else downloaded. Only a job that says so
# saves it: e2e-build, which runs before every part.
name: Playwright Chromium
description: Restore or install Playwright's Chromium headless shell

inputs:
  save:
    description: "Save the headless shell when its cache missed: true or false"
    default: "false"

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "key=playwright-chromium-$RUNNER_OS-$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.version.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: vp exec playwright install --only-shell chromium
    - if: steps.cache.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.version.outputs.key }}
